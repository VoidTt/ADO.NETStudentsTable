<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <script src="routes.js" defer></script>
</head>
<body>
<main>
  <p id="message" role="status" aria-live="polite"></p>
  <section>
    <h2>Студенты</h2>
    <form id="search-form" class="toolbar">
      <label>Имя или фамилия <input id="search-name" type="search" maxlength="100"></label>
      <button type="submit">Найти</button><button type="button" id="show-all">Показать всех</button>
    </form>
    <form id="id-form" class="toolbar">
      <label>Поиск по ID <input id="search-id" type="number" min="1" max="2147483647" required></label>
      <button type="submit">Найти по ID</button>
    </form>
    <p id="student-count"></p>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>Фамилия</th><th>Имя</th><th>Возраст</th><th>Группа</th><th>Действия</th></tr></thead>
      <tbody id="student-rows"></tbody>
    </table></div>
  </section>
  <section>
    <h2 id="form-title">Добавить студента</h2>
    <form id="student-form">
      <div class="fields">
        <label>Фамилия <input id="last-name" required maxlength="50"></label>
        <label>Имя <input id="first-name" required maxlength="50"></label>
        <label>Возраст <input id="age" type="number" min="14" max="100" required></label>
        <label>Группа <select id="group-id" required><option value="">Выберите группу</option></select></label>
      </div>
      <button type="submit" id="save-student">Добавить</button>
      <button type="button" id="cancel-edit" hidden>Отменить изменение</button>
    </form>
    <p class="hint">Студента с оценками удалить нельзя. Возраст: 14–100 лет.</p>
  </section>
  <section>
    <h2>Группы</h2>
    <form id="group-form" class="toolbar">
      <label>Название <input id="group-name" maxlength="50" required></label>
      <button type="submit">Добавить группу</button>
    </form>
    <div class="table-wrap"><table>
      <thead><tr><th>ID</th><th>Название</th><th>Студентов</th></tr></thead>
      <tbody id="group-rows"></tbody>
    </table></div>
  </section>
</main>
</body>
</html>
